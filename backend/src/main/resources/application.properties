spring.application.name=arcadestop-backend
server.port=${PORT:8080}

# PostgreSQL Database Configuration (via Environment Variables with Defaults)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/arcadestop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
