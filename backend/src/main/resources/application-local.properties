# Local development profile using in-memory H2 in PostgreSQL compatibility mode
# Useful when a dedicated PostgreSQL server is not locally running
spring.datasource.url=jdbc:h2:mem:arcadestop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

cors.allowed-origins=http://localhost:5173
